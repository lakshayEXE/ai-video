name: Instagram Carousel Auto-Poster
on:
  schedule:
    # Runs 4 times per day (00:00, 06:00, 12:00, 18:00 UTC) spaced 6 hours apart
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  generate-and-post-carousel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci

      - name: Run Carousel Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: node carousel_server.js
