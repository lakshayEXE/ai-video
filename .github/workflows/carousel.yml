name: Instagram Carousel Auto-Poster
on:
  schedule:
    # Runs at 14:00 UTC and 21:00 UTC (10:00 AM & 5:00 PM US Eastern Time / 7:30 PM & 2:30 AM IST)
    - cron: '0 14,21 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  generate-and-post-carousel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci

      - name: Run Carousel Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: node carousel_server.js
